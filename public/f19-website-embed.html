<!--
  F19 TATTOO STUDIO - Website Appointment Form
  Paste this snippet into any page on your Hostinger website.
  Creates a lead in your CRM in real-time and triggers a WhatsApp confirmation.
-->
<style>
#f19-booking-form *,#f19-booking-form *::before,#f19-booking-form *::after{box-sizing:border-box;}
#f19-booking-form{max-width:100%;overflow:hidden;}
#f19-booking-form input,#f19-booking-form textarea{width:100%;max-width:100%;min-width:0;display:block;}
#f19-booking-form .f19-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;}
#f19-booking-form .f19-row > *{min-width:0;width:100%;}
@media(max-width:820px){
  #f19-booking-form .f19-row{grid-template-columns:1fr !important;gap:12px;}
}
</style>
<div id="f19-booking-form" style="max-width:560px;margin:0 auto;padding:28px;background:#ffffff;color:#1a1a1a;border-radius:18px;border:1px solid #e5e5e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,0.08);">
  <h2 style="margin:0 0 8px;font-size:26px;font-weight:700;color:#1a1a1a;letter-spacing:-0.3px;">Book Your Tattoo Appointment</h2>
  <p style="margin:0 0 22px;color:#6b6b6b;font-size:14px;">F19 Tattoo Studio · We'll WhatsApp you instantly</p>

  <form id="f19-form" style="display:flex;flex-direction:column;gap:12px;">
    <input name="full_name" placeholder="Full Name *" required style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;outline:none;transition:border-color .2s;" onfocus="this.style.borderColor='#e53935'" onblur="this.style.borderColor='#e0e0e0'">
    <input name="phone" placeholder="Phone (+91 xxxxxxxxxx) *" required style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;outline:none;transition:border-color .2s;" onfocus="this.style.borderColor='#e53935'" onblur="this.style.borderColor='#e0e0e0'">
    <input name="email" type="email" placeholder="Email (optional)" style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;outline:none;transition:border-color .2s;" onfocus="this.style.borderColor='#e53935'" onblur="this.style.borderColor='#e0e0e0'">
    <textarea name="tattoo_idea" placeholder="Describe your tattoo idea..." rows="3" style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;resize:vertical;outline:none;transition:border-color .2s;font-family:inherit;" onfocus="this.style.borderColor='#e53935'" onblur="this.style.borderColor='#e0e0e0'"></textarea>
    <div class="f19-row">
      <input name="placement" placeholder="Placement (e.g. Forearm)" style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;outline:none;transition:border-color .2s;" onfocus="this.style.borderColor='#e53935'" onblur="this.style.borderColor='#e0e0e0'">
      <input name="budget" placeholder="Budget (INR)" style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;outline:none;transition:border-color .2s;" onfocus="this.style.borderColor='#e53935'" onblur="this.style.borderColor='#e0e0e0'">
    </div>
    <input name="preferred_date" type="text" placeholder="Preferred Date" style="padding:13px 16px;border-radius:10px;border:1px solid #e0e0e0;background:#f7f7f7;color:#1a1a1a;font-size:14px;outline:none;color-scheme:light;transition:border-color .2s;" onfocus="this.type='date';this.style.borderColor='#e53935'" onblur="if(!this.value){this.type='text';}this.style.borderColor='#e0e0e0'">
    <button type="submit" id="f19-submit" style="margin-top:10px;padding:15px;border:none;border-radius:30px;background:linear-gradient(135deg,#ff5722 0%,#e53935 100%);color:#ffffff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.3px;box-shadow:0 8px 20px rgba(229,57,53,0.35);transition:transform .15s, box-shadow .15s;" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 10px 24px rgba(229,57,53,0.45)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 8px 20px rgba(229,57,53,0.35)'">Book an Appointment</button>
    <div id="f19-status" style="text-align:center;font-size:14px;min-height:20px;"></div>
  </form>
</div>

<script>
(function(){
  var ENDPOINT = "https://edwmlzhbrtchnjfdntrc.supabase.co/functions/v1/website-lead-intake";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkd21semhicnRjaG5qZmRudHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0Mjc4MDcsImV4cCI6MjA4ODAwMzgwN30.KYca-5nNojNuTz8XSBoJW6WIu0_8Fg9SrOpqT1L0xdI";

  var form = document.getElementById("f19-form");
  var btn = document.getElementById("f19-submit");
  var status = document.getElementById("f19-status");

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var data = {};
    new FormData(form).forEach(function(v,k){ data[k] = v; });

    btn.disabled = true;
    btn.textContent = "Sending...";
    status.style.color = "#a8a8a8";
    status.textContent = "";

    fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": ANON_KEY,
        "Authorization": "Bearer " + ANON_KEY
      },
      body: JSON.stringify(data)
    })
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, body:j}; }); })
    .then(function(res){
      if (res.ok && res.body.success) {
        status.style.color = "#22c55e";
        status.textContent = "Request received! Check your WhatsApp shortly.";
        form.reset();
      } else {
        status.style.color = "#ff6b6b";
        status.textContent = (res.body.error || "Something went wrong. Please call us.");
      }
    })
    .catch(function(){
      status.style.color = "#ff6b6b";
      status.textContent = "Network error. Please try again.";
    })
    .finally(function(){
      btn.disabled = false;
      btn.textContent = "Book an Appointment";
    });
  });
})();
</script>
